name: Validate wiki

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail
          test -s site/index.html
          test -s site/styles.css
          test -s site/app.js
          test -f site/.nojekyll

      - name: Validate JavaScript syntax
        run: node --check site/app.js

      - name: Validate documentation links
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'https://www.curseforge.com/minecraft/mc-mods/pokebadges' site/index.html
          grep -q 'https://modrinth.com/mod/pokebadges' site/index.html
          grep -q 'https://github.com/LevelsFR/PokeBadges-Wiki' site/index.html
